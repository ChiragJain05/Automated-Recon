# =============================================================================
#  RECON FRAMEWORK — Configuration
#  Copy this file to config.local.conf to override without touching defaults.
# =============================================================================

# -----------------------------------------------------------------------------
# PERFORMANCE
# -----------------------------------------------------------------------------
THREADS=25
RATE=50
TIMEOUT=10
RETRIES=2

# -----------------------------------------------------------------------------
# WORDLISTS
# -----------------------------------------------------------------------------
WORDLIST_CONTENT="/usr/share/seclists/Discovery/Web-Content/common.txt"
WORDLIST_CONTENT_BIG="/usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt"
WORDLIST_SUBS="/usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt"
WORDLIST_SUBS_BIG="/usr/share/seclists/Discovery/DNS/subdomains-top1million-20000.txt"
WORDLIST_API="/usr/share/seclists/Discovery/Web-Content/api/objects.txt"
WORDLIST_PARAMS="/usr/share/seclists/Discovery/Web-Content/burp-parameter-names.txt"

# -----------------------------------------------------------------------------
# API KEYS
# -----------------------------------------------------------------------------
SHODAN_API_KEY=""
SECURITYTRAILS_KEY=""
CENSYS_API_ID=""
CENSYS_API_SECRET=""
GITHUB_TOKEN=""
CHAOS_KEY=""                    # ProjectDiscovery Chaos dataset

# -----------------------------------------------------------------------------
# NOTIFICATIONS
# -----------------------------------------------------------------------------
DISCORD_WEBHOOK=""
SLACK_WEBHOOK=""
NOTIFY_ON_COMPLETION=true
NOTIFY_ON_CRITICAL=true         # Alert immediately on critical finding

# -----------------------------------------------------------------------------
# MODULE TOGGLES
# Default state before the interactive menu loads.
# The menu can override these per-run.
# -----------------------------------------------------------------------------
ENABLE_SUBDOMAIN=true
ENABLE_DNS=true
ENABLE_PORTS=true
ENABLE_HTTP=true
ENABLE_CRAWL=true
ENABLE_JS=true
ENABLE_PARAMS=true
ENABLE_CONTENT=true
ENABLE_VULN=true
ENABLE_CLOUD=false
ENABLE_OSINT=false
ENABLE_TAKEOVER=true

# -----------------------------------------------------------------------------
# SCAN BEHAVIOUR
# -----------------------------------------------------------------------------
PASSIVE_ONLY=false              # true = no active scanning at all
FOLLOW_REDIRECTS=true
RANDOM_AGENT=true
SCREENSHOT=true
NUCLEI_SEVERITY="critical,high,medium"
NMAP_TOP_PORTS=100
PORT_SCAN_TYPE="c"              # c = connect, s = syn (requires root)

# -----------------------------------------------------------------------------
# OUTPUT
# -----------------------------------------------------------------------------
OUTPUT_DIR="recon"
REPORT_FORMAT="html"            # html | markdown | both
KEEP_RAW=true                   # Keep raw tool output alongside parsed results
LOG_LEVEL="info"                # debug | info | warn | error
